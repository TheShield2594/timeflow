version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    # One PR per weekly batch for the dev toolchain — vite, vitest, eslint and
    # typescript-eslint move together, and separate PRs for each just fail
    # against one another's peer ranges.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # React 19 is a deliberate migration, not a dependency bump: the Power
      # Apps SDK types are pinned to the React 18 tree.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  # The workflow pins actions to full commit SHAs, which is right but means
  # nothing updates them on its own.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
