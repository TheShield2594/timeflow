version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    # Dev tooling is grouped so peer-coupled packages move in one PR: a plugin
    # pinned to its host's major cannot cross that major on its own, and split
    # across two PRs neither side resolves.
    #
    # This used to be a single minor+patch batch, which left majors arriving
    # one package per PR — the very case the grouping exists to prevent. It is
    # how #144 and #146 arrived: eslint 10 in one, the react-hooks plugin that
    # peers on it in another, and `npm ci` failing on either alone (#157). So
    # the cohorts below are matched by name across *all* update types.
    #
    # A dependency joins the first group it matches, so they sit above the
    # catch-all batch.
    groups:
      # Every plugin, config and preset here declares a peer range on eslint
      # itself, and @eslint/js pins the major outright (`^10.0.0`). None of
      # them can cross a major alone. typescript is in the cohort for the
      # mirror image of that reason: typescript-eslint peers on *it*
      # (`>=4.8.4 <6.1.0`), so the compiler and the linter that parses with it
      # have to cross a major in the same PR or neither half resolves.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "eslint-config-*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
        update-types:
          - major
          - minor
          - patch
      # Tighter still: @vitest/coverage-v8 peers on an *exact* vitest version,
      # so a vitest bump without it doesn't just warn, it fails to resolve.
      # @vitejs/plugin-react peers on vite's major the same way.
      vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "@vitest/*"
        update-types:
          - major
          - minor
          - patch
      # Everything else dev-side. Majors stay out: outside the cohorts above
      # they're one-package migrations that deserve their own PR and their own
      # decision, not a silent seat in the weekly batch.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is not adoptable yet, whatever the weekly PR offers.
      # Every published typescript-eslint — 8.70.0 and the 8.70.1 canary alike
      # — still peers at `>=4.8.4 <6.1.0`, so a tree holding both does not
      # resolve and `npm ci` fails before a test runs (#147). That peer range
      # is not bookkeeping; it is typescript-estree naming the compiler APIs it
      # parses against, so --legacy-peer-deps buys a tree that installs and a
      # linter that may not parse.
      #
      # The bound below is that range's upper edge on purpose: lift it in the
      # PR that lifts typescript-eslint past it (#161), not before. 6.0.x is
      # deliberately left out — it resolves against the linter today, and is a
      # language major that earns its own PR like any other.
      - dependency-name: typescript
        versions: [">= 6.1"]
      # React 19 is a deliberate migration, not a dependency bump: the Power
      # Apps SDK types are pinned to the React 18 tree.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  # The workflow pins actions to full commit SHAs, which is right but means
  # nothing updates them on its own.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
